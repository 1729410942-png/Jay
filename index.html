<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记事本</title>
<style>
body { font-family: sans-serif; background: #fafafa; padding: 40px 20px; color: #333; }
h2 { font-weight: normal; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
textarea {
  width: 100%;
  min-height: 260px;
  border: none;
  background: transparent;
  color: #666;
  font-size: 16px;
  line-height: 1.8;
  outline: none;
  resize: none;
}
.dot {
  margin-top: 40px;
  font-size: 12px;
  color: #ccc;
}
.dot a { color: #ddd; text-decoration: none; }
</style>
</head>
<body>

<h2>我的记事本</h2>

<textarea id="note" placeholder="记录一些日常备忘……"></textarea>

<div class="dot">
  <a href="javascript:void(0)" onclick="checkPassword()">·</a>
</div>

<script>
var note = document.getElementById("note");
var saved = localStorage.getItem("my_note");
if (saved) {
  note.value = saved;
}

note.addEventListener("input", function () {
  localStorage.setItem("my_note", note.value);
});

function checkPassword() {
  var pwd = prompt("请输入密码：");
  if (pwd === "tmj5201314") {
    window.location.href = "https://chat.iris.to/";
  } else if (pwd !== null) {
    alert("密码错误");
  }
}
</script>

</body>
</html>
