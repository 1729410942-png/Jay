<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记事本</title>
<style>
body { font-family: sans-serif; background: #fafafa; padding: 40px 20px; color: #333; }
h2 { font-weight: normal; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
textarea {
  width: 100%;
  min-height: 300px;
  border: none;
  background: transparent;
  color: #666;
  font-size: 16px;
  line-height: 1.8;
  outline: none;
  resize: none;
}
.footer { margin-top: 60px; text-align: center; font-size: 13px; }
.footer a { color: #bbb; text-decoration: none; }
</style>
</head>
<body>

<h2>我的记事本</h2>
<textarea id="note" placeholder="记录一些日常备忘……"></textarea>
<div class="footer">
  <a href="javascript:void(0)" onclick="checkPassword()">.</a>
</div>

<script>
var note = document.getElementById("note");
var saved = localStorage.getItem("my_note");
if (saved) { note.value = saved; }
note.addEventListener("input", function () {
  localStorage.setItem("my_note", note.value);
});

function checkPassword() {
  var pwd = prompt("iu");
  // 注意：下面这行双引号里的就是你设置的真实密码，必须用英文双引号
  if (pwd === "tmj5201314") {
    // 加上一句提示，让你知道代码生效了
    alert("密码正确，正在进入...");
    // 强制跳转写法
    window.location.assign("https://chat.iris.to/");
  } else if (pwd !== null && pwd !== "") {
    alert("密码错误，请重试！");
  }
}
</script>

</body>
</html>
